<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopkeeper Dashboard</title>
  <link rel="stylesheet" href="shopkeeper.css">
</head>
<body>
  <div class="container">
    <h2>Welcome, Buyer 🛒</h2>
    
    <h3>Available Crops</h3>
    <table id="cropTable">
      <tr>
        <th>Crop</th>
        <th>Qty (kg)</th>
        <th>Price</th>
        <th>Location</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </table>

    <h3>Your Cart</h3>
    <table id="cartTable">
      <tr>
        <th>Crop</th>
        <th>Qty (kg)</th>
        <th>Price</th>
        <th>Remove</th>
      </tr>
    </table>
  </div>
  <script src="shopkeeper.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopkeeper Login</title>
<link rel="stylesheet" href="shopkeeper.css">
<style>
  body{
    background-image: url('shopkeeperbg.jpg');
  }
</style>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f3f7f2;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#fff;padding:24px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.08);width:360px}
h2{text-align:center;color:#2d572c;margin-bottom:15px;}
input,button,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box;}
button{background:#56ab2f;color:#fff;border:none;cursor:pointer}
#msg{font-size:14px;margin-top:6px;text-align:center;}
#otpSection{display:none;}
</style>
<link rel="stylesheet" href="shopkeeper.css">
</head>
<body>
<div class="box">
  <h2>Shopkeeper Login</h2>

  <input id="name" placeholder="Enter Name" required />
  <input id="phone" placeholder="Mobile Number" required />
  <button id="sendBtn">Send OTP</button>

  <div id="otpSection">
    <input id="otp" placeholder="Enter OTP" />
    <input id="aadhaar" placeholder="Enter Aadhaar (12 digits)" maxlength="12" />
    <input id="imageUpload" type="file" accept="image/*" />

    <input id="pan" placeholder="PAN Card (AAAAA1111A)" maxlength="10" />
    <input id="gst" placeholder="GST ID (15 chars)"maxlength="15" />
    <input id="shopName" placeholder="Shop Name" />
    <input id="shopType" placeholder="Shop Type" />

    <button id="verifyBtn">Verify & Login</button>
    <div id="msg"></div>
  </div>
</div>

<script src="shopkeeper.js"></script>
</body>
</html>
